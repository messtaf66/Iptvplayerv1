name: Build TvMax V9 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip TvMaxV9.zip -d project

      - name: Configure AndroidX
        run: |
          cp gradle.properties project/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> project/gradle.properties

      - name: Configure Android Gradle Plugin
        run: |
          sed -i 's/com.android.application") version "8.10.2"/com.android.application") version "8.9.0"/' project/build.gradle.kts

      - name: Configure JVM target
        run: |
          python3 - <<'PY'
          p = "project/app/build.gradle.kts"
          s = open(p).read()

          s = s.replace(
              'android {',
              '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }'''
          )

          s = s.replace(
              'dependencies {',
              '''kotlin {
              jvmToolchain(17)
          }

          dependencies {'''
          )

          open(p, "w").write(s)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TvMax-V9-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
