name: Build IPTV Player APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip TvMaxV2-heap-fix.zip -d project

      - name: Configure AndroidX
        run: |
          cp gradle.properties project/gradle.properties
      - name: Configure JVM target
        run: |
          python3 - <<'PY'
          p = "project/app/build.gradle.kts"
          s = open(p).read()
          s = s.replace(
              'android {',
              '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }'''
          )
          s = s.replace(
              'dependencies {',
              '''kotlin {
              jvmToolchain(17)
          }

          dependencies {'''
          )
          open(p, "w").write(s)
          PY
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
